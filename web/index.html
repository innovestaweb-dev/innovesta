<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Flutter base path. Must stay near the top, before any relative URL. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">

  <!-- ===================== SEO ===================== -->
  <!-- Keep the title / description identical to the "home" SeoPage in main.dart.
       The app updates them per page after it starts. -->
  <title>INNOVISTA | 3D Architectural Visualization &amp; VR Studio</title>

  <meta
    name="description"
    content="Photorealistic 3D interior &amp; exterior rendering, architectural animation, interactive walkthroughs and VR for architects, developers and homeowners."
  >

  <meta name="robots" content="index, follow, max-image-preview:large">

  <!--
    AFTER YOU HAVE YOUR DOMAIN, replace YOUR-DOMAIN.com and uncomment.
    WhatsApp / Facebook / X read ONLY this static HTML (they do not run
    JavaScript), so og:url and og:image must be written here, with a real
    1200x630 image placed in the web/ folder (web/og-image.jpg).
  -->
  <!-- <link rel="canonical" href="https://YOUR-DOMAIN.com/"> -->

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="INNOVISTA">
  <meta
    property="og:title"
    content="INNOVISTA | 3D Architectural Visualization &amp; VR Studio"
  >
  <meta
    property="og:description"
    content="Photorealistic 3D rendering, architectural animation, interactive walkthroughs and immersive VR experiences."
  >
  <!-- <meta property="og:url" content="https://YOUR-DOMAIN.com/"> -->
  <!-- <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.jpg"> -->
  <!-- <meta property="og:image:width" content="1200"> -->
  <!-- <meta property="og:image:height" content="630"> -->

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta
    name="twitter:title"
    content="INNOVISTA | 3D Architectural Visualization &amp; VR Studio"
  >
  <meta
    name="twitter:description"
    content="Photorealistic architectural rendering, interactive walkthroughs and VR experiences."
  >
  <!-- <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.jpg"> -->

  <!-- ===================== App identity ===================== -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="INNOVISTA">

  <!-- Icons: these files must exist inside the web/ folder -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- ===================== Loading splash ===================== -->
  <style>
    html, body {
      margin: 0;
      background: #171717;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #171717;
      color: #F4EFE6;
      font-family: Arial, sans-serif;
      transition: opacity .4s ease;
    }

    #loading .brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    #loading .bar {
      width: 120px;
      height: 2px;
      margin-top: 22px;
      background: #3B3935;
      overflow: hidden;
    }

    #loading .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: #B6A080;
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(300%); }
    }
  </style>
</head>

<body>

  <!-- Shown only when JavaScript is disabled / for crawlers without JS -->
  <noscript>
    <h1>INNOVISTA — Architectural Visualization Studio</h1>
    <p>
      Realistic 3D architectural renders, cinematic animation,
      interactive walkthroughs and VR experiences.
    </p>
    <nav>
      <a href="/services">Services</a> ·
      <a href="/portfolio">Selected Work</a> ·
      <a href="/interactive">Interactive</a> ·
      <a href="/free-tools">Free Tools</a> ·
      <a href="/contact">Contact</a>
    </nav>
    <p>Please enable JavaScript to view this website.</p>
  </noscript>

  <div id="loading">
    <div class="brand">INNOVISTA</div>
    <div class="bar"></div>
  </div>

  <script>
    // Flutter fires this event when the first frame is drawn.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;

      el.style.opacity = '0';

      setTimeout(function () {
        el.remove();
      }, 450);
    });
  </script>

  <!-- hCaptcha (contact form) -->
  <script
    src="https://js.hcaptcha.com/1/api.js?render=explicit"
    async
    defer>
  </script>

  <!-- Defines window.innovistaCaptcha (render / getToken / reset).
       This file MUST exist in web/ next to index.html. -->
  <script src="hcaptcha_bridge.js"></script>

  <!-- Flutter -->
  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
